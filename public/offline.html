<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4f46e5">
    <title>Offline · Personal Cost Management</title>
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               background: #f5f7fb; color: #0f172a; text-align: center; }
        @media (prefers-color-scheme: dark) { body { background: #0b1120; color: #e5e7eb; } }
        .mark { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto; background: linear-gradient(135deg, #6366f1, #8b5cf6); }
        h1 { font-size: 1.3rem; margin: 1rem 0 .5rem; }
        p { color: #64748b; max-width: 320px; margin: 0 auto 1.25rem; }
        button { font: inherit; border: 0; border-radius: 10px; padding: .7rem 1.4rem; background: #4f46e5; color: #fff; }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true"></div>
        <h1>You're offline</h1>
        <p>Personal Cost Management needs a connection to load your latest figures.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
